[project]
name = "ofertas"
version = "0.1.0"
description = "Motor de búsqueda de ofertas en tiendas en línea de Colombia"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "truststore>=0.10.5",
]

[project.scripts]
ofertas = "ofertas.cli:main"

[project.optional-dependencies]
navegador = [
    "playwright>=1.65.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ofertas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "red: pruebas que consultan tiendas reales (se excluyen por defecto)",
]
addopts = "-m 'not red'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# El JavaScript incrustado de los extractores no se parte en líneas cortas.
"src/ofertas/conectores/navegador.py" = ["E501"]
